<defs>
<radialGradient id="bg" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="#dcebee"/><stop offset="1" stop-color="#9fbcc2"/></radialGradient>
<radialGradient id="skin" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#cf9668"/><stop offset=".55" stop-color="#b67a52"/><stop offset="1" stop-color="#8a5534"/></radialGradient>
<linearGradient id="neck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5534"/><stop offset="1" stop-color="#b67a52"/></linearGradient>
<radialGradient id="blush" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e2604f" stop-opacity=".5"/><stop offset="1" stop-color="#e2604f" stop-opacity="0"/></radialGradient>
<radialGradient id="shine" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="iris" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#7a4a2a"/><stop offset="1" stop-color="#2a1608"/></radialGradient>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="drop" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".35"/></filter>
<linearGradient id="hat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fbf3df"/><stop offset=".6" stop-color="#e9dcc0"/><stop offset="1" stop-color="#c4b28e"/></linearGradient><linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9c8c7a"/><stop offset=".5" stop-color="#7b6c5d"/><stop offset="1" stop-color="#52463b"/></linearGradient><linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ddd6c8"/></linearGradient>
</defs>
<style>
.head{transform-origin:100px 150px;animation:sway 6.4s ease-in-out infinite}
.body{transform-origin:100px 200px;animation:breathe 5.12s ease-in-out infinite}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5.3s infinite}
.swing{transform-box:fill-box;transform-origin:top center;animation:swing 3.20s ease-in-out infinite alternate}
.brow{animation:brow 9.01s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-2px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025,1.035)}}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%,96%{transform:scaleY(.08)}}
@keyframes swing{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes brow{0%,80%,100%{transform:translateY(0)}86%,92%{transform:translateY(-2.5px)}}
.hat{transform-origin:100px 66px;animation:tip 6.4s ease-in-out infinite}@keyframes tip{0%,70%,100%{transform:rotate(0)}78%,88%{transform:rotate(-7deg) translateY(-3px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
