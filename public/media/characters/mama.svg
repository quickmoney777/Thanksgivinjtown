<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
<defs>
<radialGradient id="bg" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="#fdeeea"/><stop offset="1" stop-color="#e3b8b0"/></radialGradient>
<radialGradient id="skin" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#d39b72"/><stop offset=".55" stop-color="#b87e58"/><stop offset="1" stop-color="#8c5a3a"/></radialGradient>
<linearGradient id="neck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8c5a3a"/><stop offset="1" stop-color="#b87e58"/></linearGradient>
<radialGradient id="blush" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e2604f" stop-opacity=".5"/><stop offset="1" stop-color="#e2604f" stop-opacity="0"/></radialGradient>
<radialGradient id="shine" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="iris" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#7a4a2a"/><stop offset="1" stop-color="#2a1608"/></radialGradient>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="drop" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".35"/></filter>
<linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eeeff3"/><stop offset=".5" stop-color="#c3c5cc"/><stop offset="1" stop-color="#8f929c"/></linearGradient><linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d0362c"/><stop offset="1" stop-color="#7c130f"/></linearGradient><linearGradient id="dress" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6dcc8"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe9a0"/><stop offset=".5" stop-color="#e0b24a"/><stop offset="1" stop-color="#9c7420"/></linearGradient>
</defs>
<style>
.head{transform-origin:100px 150px;animation:sway 6.0s ease-in-out infinite}
.body{transform-origin:100px 200px;animation:breathe 4.80s ease-in-out infinite}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.9s infinite}
.swing{transform-box:fill-box;transform-origin:top center;animation:swing 3.00s ease-in-out infinite alternate}
.brow{animation:brow 8.33s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-2px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025,1.035)}}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%,96%{transform:scaleY(.08)}}
@keyframes swing{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes brow{0%,80%,100%{transform:translateY(0)}86%,92%{transform:translateY(-2.5px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
