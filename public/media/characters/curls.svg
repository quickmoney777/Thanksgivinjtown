</g><g class="eye"><ellipse cx="119" cy="91" rx="8.5" ry="9" fill="#fffdf8"/>
<circle cx="119.8" cy="92" r="5.8" fill="url(#iris)"/><circle cx="119.8" cy="92" r="2.6" fill="#120904"/>
