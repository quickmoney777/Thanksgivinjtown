<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
<defs>
<radialGradient id="bg" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="#fff0dc"/><stop offset="1" stop-color="#f0bd8a"/></radialGradient>
<radialGradient id="skin" cx="40%" cy="30%" r="80%"><stop offset="0" stop-color="#d2966a"/><stop offset=".55" stop-color="#b57649"/><stop offset="1" stop-color="#8a5330"/></radialGradient>
<linearGradient id="neck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5330"/><stop offset="1" stop-color="#b57649"/></linearGradient>
<radialGradient id="blush" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#e2604f" stop-opacity=".5"/><stop offset="1" stop-color="#e2604f" stop-opacity="0"/></radialGradient>
<radialGradient id="shine" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="iris" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#7a4a2a"/><stop offset="1" stop-color="#2a1608"/></radialGradient>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
<filter id="drop" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".35"/></filter>
<linearGradient id="hair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4b3830"/><stop offset=".45" stop-color="#1e1411"/><stop offset="1" stop-color="#0d0807"/></linearGradient><linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d63a30"/><stop offset="1" stop-color="#84150f"/></linearGradient><linearGradient id="dup" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa257"/><stop offset="1" stop-color="#c9560f"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0b0"/><stop offset=".5" stop-color="#f0c860"/><stop offset="1" stop-color="#a87c22"/></linearGradient>
</defs>
<style>
.head{transform-origin:100px 150px;animation:sway 4.8s ease-in-out infinite}
.body{transform-origin:100px 200px;animation:breathe 3.84s ease-in-out infinite}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.0s infinite}
.swing{transform-box:fill-box;transform-origin:top center;animation:swing 2.40s ease-in-out infinite alternate}
.brow{animation:brow 6.80s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(3deg) translateY(-2px)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.025,1.035)}}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%,96%{transform:scaleY(.08)}}
@keyframes swing{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
@keyframes brow{0%,80%,100%{transform:translateY(0)}86%,92%{transform:translateY(-2.5px)}}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
